<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
    }

    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
      padding: 50px 20px;
    }

    h1 {
      font-size: 3rem;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffaa;
      animation: glitch 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 2px #ff0066; }
      25% { text-shadow: -2px -2px #00ffcc; }
      50% { text-shadow: 3px 3px #ff0066; }
      75% { text-shadow: -3px 0 #00ffcc; }
      100% { text-shadow: 2px -2px #ff0066; }
    }

    p {
      color: #aaaaaa;
      font-size: 1.2rem;
      margin-bottom: 40px;
    }

    .team-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      width: 100%;
      max-width: 900px;
    }

    .member-card {
      background: rgba(20, 20, 20, 0.9);
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 25px;
      transition: 0.3s;
      box-shadow: 0 0 15px #00ffaa33;
    }

    .member-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #00ffcc;
    }

    .member-card h2 {
      color: #00ffcc;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .member-card p {
      font-size: 1rem;
      color: #cccccc;
    }

    .buttons {
      margin-top: 50px;
    }

    button {
      background: transparent;
      color: #00ffcc;
      border: 3px solid #00ffcc;
      padding: 10px 30px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background-color: #00ffcc;
      color: #0d0d0d;
      box-shadow: 0 0 25px #00ffcc;
      transform: scale(1.05);
    }

  </style>
</head>
<body>
  <h1>Meet the Team</h1>
  <p>The minds behind "Errors and Error Correction"</p>

  <div class="team-container">
    <div class="member-card">
      <h2>Arnado, Aristhea Lyn</h2>
      <p>BSIT - NS - 3A</p>
    </div>
    <div class="member-card">
      <h2>Arboleda, Jan Ernest</h2>
      <p>BSIT - NS - 3A</p>
    </div>
    <div class="member-card">
      <h2>Balucan, Casey Althea</h2>
      <p>BSIT - NS - 3A</p>
    </div>
    <div class="member-card">
      <h2>Crueta, Al Samuel</h2>
      <p>BSIT - NS - 3A</p>
    </div>
  </div>

</body>
</html>
