<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Members | Errors and Error Correction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
    }

    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      padding: 20px;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 2px solid #00ffcc;
    }

    header h1 {
      font-size: 2rem;
      text-shadow: 0 0 10px #00ffaa;
    }

    header h1 a {
      color: #00ffcc;
      text-decoration: none;
      transition: 0.3s;
    }

    header h1 a:hover {
      color: #00ffaa;
      text-shadow: 0 0 15px #00ffcc;
    }

    .nav-buttons button {
      background: transparent;
      color: #00ffcc;
      border: 2px solid #00ffcc;
      padding: 10px 25px;
      margin-left: 15px;
      font-size: 1.1rem;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.3s;
    }

    .nav-buttons button:hover {
      background-color: #00ffcc;
      color: #0d0d0d;
      box-shadow: 0 0 15px #00ffcc;
      transform: scale(1.05);
    }

    /* TEAM SECTION */
    .team-container {
      max-width: 900px;
      margin: 60px auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px;
      text-align: center;
    }

    .member {
      background: #111;
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 30px 10px;
      box-shadow: 0 0 15px #00ffaa33;
      transition: 0.3s;
    }

    .member:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px #00ffcc;
    }

    .surname {
      font-weight: bold;
      color: #00ffcc;
      font-size: 1.5rem;
    }

    .firstname {
      font-weight: bold;
      color: #00ffcc;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .details {
      color: #cccccc;
      font-size: 1rem;
      letter-spacing: 2px;
    }

    @media (max-width: 700px) {
      .team-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1><a href="index.html">Errors and Error Correction</a></h1>
    <div class="nav-buttons">
      <button onclick="location.href='topics.html'">Topics</button>
      <button onclick="location.href='actual_quiz.html'">Quiz</button>
      <button onclick="location.href='members.html'">Members</button>
    </div>
  </header>

  <!-- TEAM MEMBERS -->
  <section class="team-container">
    <div class="member">
      <div class="surname">Arnado,</div>
      <div class="firstname">Aristhea Lyn</div>
      <div class="details">BSIT - NS - 3A</div>
    </div>

    <div class="member">
      <div class="surname">Arboleda,</div>
      <div class="firstname">Jan Ernest</div>
      <div class="details">BSIT - NS - 3A</div>
    </div>

    <div class="member">
      <div class="surname">Balucan,</div>
      <div class="firstname">Casey Althea</div>
      <div class="details">BSIT - NS - 3A</div>
    </div>

    <div class="member">
      <div class="surname">Crueta,</div>
      <div class="firstname">Al Samuel</div>
      <div class="details">BSIT - NS - 3A</div>
    </div>
  </section>

</body>
</html>
