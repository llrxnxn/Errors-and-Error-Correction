<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Errors and Error Correction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", monospace;
    }

    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3.5rem;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffaa;
      animation: glitch 1.5s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 2px #ff0066; }
      25% { text-shadow: -2px -2px #00ffcc; }
      50% { text-shadow: 3px 3px #ff0066; }
      75% { text-shadow: -3px 0 #00ffcc; }
      100% { text-shadow: 2px -2px #ff0066; }
    }

    p {
      font-size: 1.5rem;
      color: #aaaaaa;
      margin-top: 15px;
    }

    .buttons {
      margin-top: 40px;
      display: flex;
      gap: 25px;
    }

    button {
      background: transparent;
      color: #00ffcc;
      border: 3px solid #00ffcc;
      padding: 15px 35px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.3s;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background-color: #00ffcc;
      color: #0d0d0d;
      box-shadow: 0 0 25px #00ffcc;
      transform: scale(1.05);
    }

    .terminal {
      margin-top: 50px;
      background-color: #111;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #333;
      width: 90%;
      max-width: 700px;
      text-align: left;
      font-size: 1.2rem;
      color: #00ffaa;
    }

    .error {
      color: #ff3366;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Errors and Error Correction</h1>
  <p>Learn. Practice. Collaborate.</p>

  <div class="buttons">
    <button onclick="location.href='topics.html'">Topics</button>
    <button onclick="location.href='actual_quiz.html'">Quiz</button>
    <button onclick="location.href='members.html'">Members</button>
  </div>

  <div class="terminal">
    <p><span class="error">Error:</span> Unexpected variable type in 'correction.js'</p>
    <p>→ Recheck data validation before compiling.</p>
  </div>
</body>
</html>
